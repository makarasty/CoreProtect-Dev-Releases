name: Build CoreProtect
on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/PlayPro/CoreProtect.git
          git fetch upstream
          git checkout master
          if ! git merge upstream/master --no-edit; then
            # only local divergence is this workflow file; keep ours
            git checkout --ours .github/workflows/build.yml
            git add .github/workflows/build.yml
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved conflicts outside build.yml:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi
          git push origin master

  build:
    runs-on: ubuntu-latest
    needs: sync
    permissions:
      contents: write
    steps:
      - name: Checkout CoreProtect repository
        uses: actions/checkout@v7.0.1
        with:
          repository: PlayPro/CoreProtect
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Fix branch error
        run: |
          echo "branch: development" >> src/main/resources/plugin.yml

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload CoreProtect Jar
        uses: actions/upload-artifact@v4
        with:
          name: CoreProtect Jar
          path: target/CoreProtect-*.jar

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.date.outputs.date }}
          name: "Dev Build ${{ steps.date.outputs.date }}"
          body: "Automated build from GitHub repository."
          draft: false
          prerelease: false
          artifacts: target/CoreProtect-*.jar
